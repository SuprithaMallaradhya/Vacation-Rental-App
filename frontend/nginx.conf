# Serves the built React app and proxies API traffic to the FastAPI container ("api").
# The Azure Load Balancer is layer 4, so $remote_addr here is the real client IP;
# it is forwarded so the API's per-IP login limiter sees individual users.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Large enough for the API's own request limits; media files go straight to Blob Storage.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health endpoints: /ready is the load balancer probe (API up + database reachable + schema current).
    location = /health { proxy_pass http://api:8000; }
    location = /ready  { proxy_pass http://api:8000; }

    # Swagger/ReDoc for the demo.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths return index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
