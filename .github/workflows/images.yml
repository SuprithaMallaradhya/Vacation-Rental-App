# Builds the two production images and publishes them to GitHub Container Registry.
# Pull requests only build (to catch Dockerfile errors); pushes to main also publish
# :latest and :<commit-sha>. The Azure VMs pull :latest (see deploy/compose.prod.yaml).
name: images

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "deploy/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "deploy/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: vacation-rental-api
            context: backend
            build_args: |
              EXTRAS=azure
          - name: vacation-rental-web
            context: frontend
            build_args: |
              VITE_API_BASE_URL=/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
