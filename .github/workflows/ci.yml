name: backend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_rental_test
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U vacation -d vacation_rental_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e 'backend[dev]'
      - run: python -m ruff check backend
      - run: python -m pytest backend/tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://vacation:vacation@127.0.0.1:55433/vacation_rental_test
